  <!-- Boot screen -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="scanlines"></div>
    <div class="crt loader-box">
      <div class="loader-title" id="loader-title"></div>
      <div id="boot-lines"></div>
      <div class="loader-bar" id="boot-bar"></div>
      <div class="dim">LOADING VARIANT FILE <span id="loader-file"></span><span class="cursor">█</span></div>
    </div>
  </div>

  <!-- Main terminal -->
  <div id="main" class="main hidden">
    <div class="bezel">
      <div class="screen crt">
        <div class="scanlines"></div>
        <div class="rollbar"></div>
        <div class="glass"></div>

        <header class="title-band">
          <span class="big" id="name"></span>
          <span class="hide-m mid" id="file-clock"></span>
        </header>

        <main id="pane" class="pane" tabindex="0" aria-live="polite"></main>

        <nav id="menu" class="menu" aria-label="Sections"></nav>
      </div>
    </div>

    <div class="badge-row">
      <span class="badge"><span class="led"></span><span id="badge-model"></span></span>
      <button class="prune" id="prune">[ PRUNE ]</button>
    </div>
  </div>

  <!-- After pruning -->
  <button id="restore" class="restore hidden">↺ RESTORE THE VARIANT</button>
</div>
